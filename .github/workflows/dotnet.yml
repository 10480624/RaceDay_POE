
name: RaceDay Build and Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

      - name: Build solution projects
        run: dotnet build RaceDay.Tests/RaceDay.Tests.csproj --no-restore

      - name: Run automated tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --no-build --verbosity normal
